name: Work item
description: A unit of work for the queue — feat, tckt, bug, chore or spike.
title: "Short imperative title"
body:
  - type: markdown
    attributes:
      value: |
        One atomic change per `tckt`. If a ticket grows two unrelated goals, split it.
        Decisions don't live here — they go in
        [`docs/adr/`](https://github.com/TheShrug/noitacheatsheet-companion/blob/main/docs/adr/README.md);
        a "decide X" item produces a new ADR as its output.

        After filing, add the `type:` label that matches (`feat`, `tckt`, `bug`, `chore`, `spike`) —
        the `/ticket` skill does this for you. Leave `status:` off while it's queued.

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One or two sentences — what this delivers and why. For a `feat`, the capability; for a `tckt`, the atomic change.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: The observable outcomes that mean this is done. Checkboxes, ticked on close.
      value: |
        - [ ]
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Context, links, gotchas. Link related ADRs and sibling issues (`#N`).
    validations:
      required: false
