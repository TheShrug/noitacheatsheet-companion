# Run the suite on every push and every pull request.
#
# Unlike the app repos in this fleet, main is NOT excluded here: nothing deploys
# from this repo, so there is no deploy workflow running the same tests as a
# release gate. If main were excluded, main would have no gate at all.
#
# The suite needs no network, no database and no game files — it builds its
# fixtures in t.TempDir(). So this is a plain checkout-and-test.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both, because the path code is the part most likely to break and it
        # is the part that differs per OS. A Linux-only run would not execute
        # the Windows branch of Candidates() at all.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      # The Go version lives in go.mod and nowhere else, so bumping it is one
      # edit rather than one edit plus however many workflows exist.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # There are no dependencies, so there is no go.sum and nothing to
          # cache. Left on, setup-go warns about the missing file on every
          # single run — and a warning that is always there is one nobody
          # reads when it finally means something.
          cache: false

      - name: gofmt
        if: runner.os == 'Linux'
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # -count=1 defeats the test cache: a cached PASS from a previous run tells
      # you nothing about this commit. -race because the watcher and the HTTP
      # queue will share state, and a data race that only appears on a player's
      # machine is not debuggable from here.
      - name: go test
        run: go test ./... -race -count=1

  # The binaries a player downloads are cross-compiled, and a cross-compile can
  # fail while a native test run passes. Proving they still build is cheap.
  build:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # There are no dependencies, so there is no go.sum and nothing to
          # cache. Left on, setup-go warns about the missing file on every
          # single run — and a warning that is always there is one nobody
          # reads when it finally means something.
          cache: false

      - name: build every target
        run: |
          for target in linux/amd64 windows/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            echo "==> $os/$arch"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -o /dev/null ./cmd/...
          done
